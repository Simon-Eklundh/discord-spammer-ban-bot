name: pr-check

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    # Read-only: this workflow builds but never pushes, and runs untrusted code
    # from fork pull requests.
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # buildah rather than docker/buildx -- this project is podman-only.
      - name: Build image without pushing
        uses: redhat-actions/buildah-build@v3
        with:
          image: discord-spammer-ban-bot
          tags: pr
          containerfiles: ./Containerfile
          context: .

      # Typecheck runs on the runner, not inside the image: the runner stage
      # ships only the compiled, minified dist/, so there are no sources in the
      # image left to check. Node is pinned to the major the Containerfile and
      # package.json engines already require, so this still matches production.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
